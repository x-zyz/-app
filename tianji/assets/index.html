<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F3EA">
<title>天机</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="seal" aria-hidden="true">☰</span>
      <span class="brand-sub">天机</span>
    </div>
    <div class="topbar-date" id="topDate"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button class="tab active" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM8 3v6m8-6v6M4 11h16m-12 4h3"/></svg><span class="tab-word">今日</span></button>
    <button class="tab" data-tab="chart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM4 9h16M9 9v11m6-11v11"/></svg><span class="tab-word">排盘</span></button>
    <button class="tab" data-tab="draw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10h10l-1 10H8zM9 10 7 4m5 6V3m3 7 3-6"/></svg><span class="tab-word">求签</span></button>
    <button class="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20a8 8 0 0 1 16 0M16 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg><span class="tab-word">我的</span></button>
  </nav>
</div>

<div id="sheet-root"></div>

<script src="js/vendor/lunar.js"></script>
<script src="js/data/hexagrams.js"></script>
<script src="js/astro.js"></script>
<script src="js/app.js"></script>
</body>
</html>
