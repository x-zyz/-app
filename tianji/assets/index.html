<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F3EA">
<title>天机</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/pro-chart.css">
<link rel="stylesheet" href="css/birth-form.css">
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="seal" aria-hidden="true">☰</span>
      <span class="brand-sub">天机</span>
    </div>
    <div class="topbar-date" id="topDate"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button class="tab active" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM8 3v6m8-6v6M4 11h16m-12 4h3"/></svg><span class="tab-word">今日</span></button>
    <button class="tab" data-tab="chart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM4 9h16M9 9v11m6-11v11"/></svg><span class="tab-word">排盘</span></button>
    <button class="tab" data-tab="draw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10h10l-1 10H8zM9 10 7 4m5 6V3m3 7 3-6"/></svg><span class="tab-word">求签</span></button>
    <button class="tab" data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6C9 4 6 4 3 5v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1v14"/></svg><span class="tab-word">学习</span></button>
    <button class="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20a8 8 0 0 1 16 0M16 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg><span class="tab-word">我的</span></button>
  </nav>
</div>

<div id="sheet-root"></div>

<script src="js/vendor/lunar.js"></script>
<script src="js/data/hexagrams.js"></script>
<script src="js/data/cities.js"></script>
<script src="js/solar-time.js"></script>
<script src="js/stars-special.js"></script>
<script src="js/stars-extended.js"></script>
<script src="js/stars.js"></script>
<script src="js/astro.js"></script>
<script src="js/data/classic-texts.js"></script>
<script src="js/interpretation.js"></script>
<script src="js/lore.js"></script>
<script src="js/data/classic-cases.js"></script>
<script src="js/data/classic-library.js"></script>
<script src="js/pillar-notes.js"></script>
<script src="js/useful-elements.js"></script>
<script src="js/pro-chart.js"></script>
<script src="js/birth-form.js"></script>
<script src="js/calendar.js"></script>
<script src="js/learn.js"></script>
<script src="js/updates.js"></script>
<script src="js/app.js"></script>
</body>
</html>
